# Alpaca distribution template. `alpaca onboard` writes the project's own answers into this file
# and keeps every other key with its value (these comments are not kept); `alpaca upgrade` preserves
# an installed project's copy. Each installation takes its project id from .alpaca/instance.json
# while this file stays a template. To plug in a domain, add a `profile:` key naming a dotted
# module path importable from the project root (see alpaca/profile.py).
name: Alpaca
project_id: alpaca-template
template: true
what: The engineering harness, before onboarding.
people: []
tier: public
existing_repo: false
phases:
  default:
  - requirement
  - design
  - build
  - verify
  - release
commands:
  build: bin/alpaca-python -m compileall -q alpaca
  test: bin/alpaca-python -m pytest
  lint: bin/alpaca-python -m compileall -q alpaca
  run: bin/alpaca status
paths:
  product_tree: .
  artifacts: docs
  spec_dir: design
style:
  presets: []
  banned: style/banned.txt
cwd_history: []
default_level: L2
oracle_classes:
- static
- dynamic
- selftest
- human
forbidden_literals: []
resource_class: small
fingerprint:
  command: git rev-parse HEAD
  expected: unset-until-frozen
skin:
  adapters:
  - artifact_shape: acceptance-table
    key_column: item
    step_model: step-models/requirement.json
    register: req_key
boundary_rules:
  root_only: true
  no_tmp_root: true
  realpath_containment: true
  atomic_writes: temp-then-rename
non_adoptions:
  why: Operators use native Claude Code and Codex tools; no third-party agent library is required.
  forbidden:
  - langchain
  - langgraph
  - llama_index
  - crewai
  - autogen
  - celery
  - airflow
  - prefect
  - dagster
  - temporalio
  - ray
  - flask
  - fastapi
  - django
  - tornado
  - aiohttp
  - uvicorn
  - gunicorn
  - twisted
  - http.server
  - socketserver
  - wsgiref
  sanctioned:
  - path: alpaca/serve.py
    names:
    - http.server
    - socketserver
    - wsgiref
    why: Optional read-only local dashboard.
operators:
- claude
- codex
wiki_providers:
  embedder: deterministic
  reranker: identity
  entailer: structural
  llm_extractor: 'off'
budget:
  reserve: 10
  totals:
    small: 100
    medium: 500
    large: 2000
concurrency:
  tiers:
    small: 1
    medium: 1
    large: 1
kicker_grace_seconds: 300
retention:
  store: .alpaca/store
  max_bytes: 10485760
  max_age_days: 30
barrier:
  protected_paths:
  - .alpaca/
  - .venv/
  - .env
  - .env.local
  - .env.*.local
  terms: .alpaca/sealed-terms.txt
  allow:
  - '[a-z0-9._%+\-]+@(?:[a-z0-9\-]+\.)*(?:example\.(?:com|org|net)|example|invalid|test|localhost)  #
    reserved placeholder domains (RFC 2606, RFC 6761) used by fixtures and docs; never a real mailbox'
  - '[a-z0-9._%+\-]*@(?:pytest\.(?:fixture|mark\.[a-z_]+)|cli\.command|common\.fail|contextlib\.contextmanager)(?:def[a-z0-9_]*)?  #
    the joined lane glues the end of one line to a Python decorator on the next line, and to the
    def that follows it; not an address'
  - '[a-z0-9._%+\-]*@rebootweb-upscriptunder\.alpaca  # the joined lane glues a docstring line of
    alpaca/observability/maintenance.py that names the crontab keyword @reboot; this one value only'
  - '/home/(?:owner|someone|secret)(?:/[^\s"''<>|]*)?  # generic home folders in test fixtures; no
    real user'
  allow_blobs:
  - '231a1ad716215de37ce8102dde533be859036f91  # alpaca/web/vendor/plex-sans.woff2, IBM Plex Sans
    (OFL); WOFF2 needs the brotli module to open; opened and checked by the leak audit before the
    first publish'
  - '8bdb4c4b3f8fae88cc2e3c9c744952dccf89b15a  # alpaca/web/vendor/plex-mono.woff2, IBM Plex Mono
    (OFL); WOFF2 needs the brotli module to open; opened and checked by the leak audit before the
    first publish'
  - 'b142a66f712be6b6d3e72aaf53d9a2e88b06eefc  # alpaca/web/vendor/plex-sans-medium.woff2, IBM Plex
    Sans Medium (OFL); WOFF2 needs the brotli module to open; opened and checked by the leak audit
    before the first publish'
hub:
  enabled: false
  drop: /srv/alpaca-hub/tiles
  slug: null
  name: null
  href: null
  what: null

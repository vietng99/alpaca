<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Idea to proof</title>
<desc id="desc">Example workflow: spec, runbook, checklist, agent work, a failed check, a permitted retry and a sealed report. Release needs owner approval.</desc>
<rect width="1200" height="600" fill="#0d1117"/>
<text x="40" y="67" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#e6edf3">Idea to proof</text>
<text x="1160" text-anchor="end" y="65" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#9da7b3" xml:space="preserve">EXAMPLE / LINK SHORTENER</text>
<rect x="40" y="102" width="170" height="52" rx="10" fill="#161b22"/>
<text x="53" y="134" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#b7c3d0" xml:space="preserve">01</text>
<text x="81" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b7c3d0">Raw idea</text>
<text x="217" y="133" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6e7681">&gt;</text>
<rect x="230" y="102" width="170" height="52" rx="10" fill="#161b22"/>
<text x="243" y="134" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#b7c3d0" xml:space="preserve">02</text>
<text x="271" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b7c3d0">Spec</text>
<text x="407" y="133" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6e7681">&gt;</text>
<rect x="420" y="102" width="170" height="52" rx="10" fill="#161b22"/>
<text x="433" y="134" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#b7c3d0" xml:space="preserve">03</text>
<text x="461" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b7c3d0">Runbook</text>
<text x="597" y="133" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6e7681">&gt;</text>
<rect x="610" y="102" width="170" height="52" rx="10" fill="#161b22"/>
<text x="623" y="134" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#b7c3d0" xml:space="preserve">04</text>
<text x="651" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b7c3d0">Checklist</text>
<text x="787" y="133" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6e7681">&gt;</text>
<rect x="800" y="102" width="170" height="52" rx="10" fill="#161b22"/>
<text x="813" y="134" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#b7c3d0" xml:space="preserve">05</text>
<text x="841" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b7c3d0">Agent work</text>
<text x="977" y="133" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6e7681">&gt;</text>
<rect x="990" y="102" width="170" height="52" rx="10" fill="#245da8"/>
<text x="1003" y="134" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#ffffff" xml:space="preserve">06</text>
<text x="1031" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Proof report</text>
<rect x="40" y="186" width="730" height="332" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="64" y="223" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="400" fill="#9da7b3" xml:space="preserve">.alpaca/proofs/&lt;op&gt;/&lt;id&gt;.md</text>
<path d="M40 243H770" stroke="#30363d"/>
<text x="64" y="286" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Seal the proof</text>
<text x="64" y="333" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="400" fill="#79b8ff" xml:space="preserve">Result: 41.2 ms / PASS</text>
<text x="64" y="367" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="400" fill="#e6edf3" xml:space="preserve">Attempts: 2 of 3</text>
<text x="64" y="401" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="400" fill="#e6edf3" xml:space="preserve">Evidence: load.json + logs</text>
<text x="64" y="435" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="400" fill="#79b8ff" xml:space="preserve">Report and evidence sealed</text>
<rect x="790" y="186" width="370" height="332" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="816" y="223" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#9da7b3" xml:space="preserve">NEXT ACTION</text>
<text x="816" y="274" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Close. Then continue.</text>
<text x="816" y="355" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b7c3d0">Close the task with its</text>
<text x="816" y="383" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b7c3d0">sealed report. Resume the</text>
<text x="816" y="411" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b7c3d0">next task.</text>
<text x="816" y="488" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#79b8ff" xml:space="preserve">SEALED</text>
<text x="40" y="563" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#9da7b3">Release still needs owner approval.</text>
</svg>

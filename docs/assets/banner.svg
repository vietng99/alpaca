<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Alpaca. Good work. With receipts.</title>
  <desc id="desc">A calm alpaca in side profile with a continuous tapered neck, upright ears, a short muzzle and fluffy cream fleece stands in a blue scarf beside a sealed proof. A local record for Claude Code and Codex: plan, build, prove, resume.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce2eb" stroke-width="0.7"/></pattern>
    <radialGradient id="halo"><stop stop-color="#dae6fa"/><stop offset="1" stop-color="#edf2fa"/></radialGradient>
  </defs>
  <rect width="1280" height="480" fill="#f3f5f8"/>
  <path d="M736 0H1256Q1280 0 1280 24V394H736Z" fill="url(#grid)"/>
  <circle cx="1025" cy="209" r="163" fill="url(#halo)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="52" width="235" height="30" rx="15" fill="#e3eafa"/>
    <circle cx="81" cy="67" r="4" fill="#386cbe"/>
    <text x="94" y="72" font-size="12" font-weight="700" letter-spacing="1.5" fill="#34527e">THE ENGINEERING HARNESS</text>
    <text x="58" y="212" font-size="132" font-weight="700" letter-spacing="-7" fill="#253041">Alpaca<tspan fill="#386cbe">.</tspan></text>
    <text x="65" y="270" font-size="34" font-weight="600" letter-spacing="-0.8" fill="#253041">Good work. With receipts.</text>
    <text x="66" y="318" font-size="20" fill="#586579">Plan, run and verify agent work.</text>
    <text x="66" y="349" font-size="20" fill="#586579">Keep the evidence. Resume anytime.</text>
  </g>
  <ellipse cx="1006" cy="363" rx="131" ry="13" fill="#d6dde7"/>
  <!-- Head, tapered neck and body share one continuous side-view silhouette. -->
  <g transform="translate(859 40)" stroke="#3b4658" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Far legs and tail sit behind the fleece. -->
    <path d="M78 257L81 314Q82 320 89 320H100L101 258M185 256L190 315Q191 320 198 320H207L208 257" fill="#d7d1c4"/>
    <path d="M38 223Q14 213 20 198Q23 191 29 199Q33 205 46 205" fill="#faf8f1"/>
    <!-- Alpaca ears are upright, with short pointed tips. -->
    <path d="M177 74Q164 53 173 20Q176 12 179 23L193 67" fill="#faf8f1"/>
    <path d="M178 36L184 62" fill="none" stroke="#cbbdac" stroke-width="5"/>
    <path d="M205 64Q204 41 223 15Q229 9 227 20L224 73" fill="#faf8f1"/>
    <path d="M221 31L215 61" fill="none" stroke="#cbbdac" stroke-width="5"/>
    <!-- No join line or gap between the head, neck and shoulder. -->
    <path d="M167 92
      Q159 85 165 77Q161 67 174 65Q178 54 189 59Q199 50 209 59Q221 56 228 67
      Q237 72 236 86Q240 93 253 98Q265 103 263 115Q264 126 251 132Q241 138 228 135
      Q220 145 222 159Q226 166 222 179Q228 188 224 200Q231 209 229 222
      Q240 230 234 244Q241 257 230 267Q233 280 216 285Q207 297 191 289
      Q175 299 161 291Q146 300 131 290Q115 298 101 290Q84 299 70 287Q53 294 42 280
      Q26 278 27 263Q15 253 24 239Q20 224 33 216Q33 203 49 202Q57 189 73 195
      Q87 186 101 194Q117 185 129 196Q141 191 149 197
      Q161 183 161 164Q156 154 163 144Q159 132 166 121Q163 107 167 92Z" fill="#faf8f1"/>
    <!-- Planted legs emerge naturally from the body. -->
    <path d="M48 272L47 317Q47 327 57 327H68Q75 327 74 319L78 282M176 281L178 318Q178 327 187 327H198Q205 327 203 318L207 282" fill="#faf8f1"/>
    <path d="M49 323H73M180 323H202" stroke-width="6"/>
    <!-- A short muzzle, small nostril and relaxed eye, all in the same profile. -->
    <path d="M224 96Q239 93 252 101Q263 107 257 119Q253 128 238 129Q224 127 219 116Q216 104 224 96Z" fill="#e8dfcf" stroke="none"/>
    <path d="M252 110L255 112" stroke="#596273" stroke-width="2.5"/>
    <path d="M243 123L253 121" fill="none" stroke="#596273" stroke-width="2"/>
    <g id="eyes">
      <path d="M211 91Q218 94 225 90" fill="none" stroke-width="2.5"/>
      <ellipse cx="219" cy="94" rx="2.5" ry="1.5" fill="#3b4658" stroke="none"/>
    </g>
    <!-- Fleece follows the neck and shoulder instead of a stack of circles. -->
    <g fill="none" stroke="#d8d2c6" stroke-width="2.4">
      <path d="M173 78Q181 71 189 77M190 70Q199 65 207 71"/>
      <path d="M175 111Q181 104 188 110M193 134Q202 129 210 135M175 166Q183 160 190 167"/>
      <path d="M165 197Q172 188 181 194M195 220Q204 214 212 221"/>
      <path d="M44 232Q51 222 60 229M76 211Q84 204 92 212M113 222Q122 213 131 223"/>
      <path d="M56 259Q64 250 73 258M88 245Q96 237 105 245M120 273Q128 265 137 272M155 245Q164 236 173 246M190 265Q198 256 207 264"/>
    </g>
    <!-- A blue scarf follows the taper of the neck. -->
    <g id="scarf-tail">
      <path d="M203 161L224 194L210 203L191 165" fill="#386cbe"/>
      <path d="M215 195L219 202M210 198L214 205" stroke="#b8d1fa" stroke-width="2"/>
    </g>
    <path d="M162 147Q190 160 221 148L222 164Q193 178 161 164Z" fill="#386cbe"/>
    <path d="M169 160Q189 169 214 159" fill="none" stroke="#85b0ef" stroke-width="2"/>
  </g>
  <g transform="translate(1173 292) rotate(9)">
    <circle r="42" fill="#253041"/>
    <circle r="35" fill="none" stroke="#99bced" stroke-dasharray="2 5"/>
    <path d="M-13 -6L-3 4L15 -15" fill="none" stroke="#f3f5f8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="22" text-anchor="middle" fill="#f3f5f8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2">SEALED</text>
  </g>
  <g fill="none" stroke="#95a9c7" stroke-width="2" stroke-linecap="round">
    <path d="M856 122v14m-7-7h14M1188 156v12m-6-6h12"/>
    <circle cx="896" cy="290" r="3"/><circle cx="1158" cy="89" r="3"/>
  </g>
  <path d="M64 395H1216" stroke="#d6dde7"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.4" fill="#586579">
    <text x="66" y="439"><tspan fill="#386cbe" font-weight="700">01</tspan> PLAN <tspan dx="25" fill="#a2adbd">/</tspan><tspan dx="25" fill="#386cbe" font-weight="700">02</tspan> BUILD <tspan dx="25" fill="#a2adbd">/</tspan><tspan dx="25" fill="#386cbe" font-weight="700">03</tspan> PROVE <tspan dx="25" fill="#a2adbd">/</tspan><tspan dx="25" fill="#386cbe" font-weight="700">04</tspan> RESUME</text>
    <text x="1214" y="439" text-anchor="end" font-size="12" letter-spacing="1">CLAUDE CODE + CODEX</text>
  </g>
</svg>

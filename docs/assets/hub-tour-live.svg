<title id="title">Alpaca hub tour: Live job monitor</title>
<desc id="desc">Simplified feature illustration with invented sample data. Profile-enabled log tiles follow each job as its stage changes. Focus a tile, pause following, or pin finished jobs to compare their output.</desc>
